<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <rect width="1600" height="900" fill="#F8F7F3"/>

  <text x="80" y="110" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="850">
    Every Agent Needs a Judge
  </text>
  <text x="82" y="160" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500">
    The agent can do the work. A judge decides whether it is actually done.
  </text>

  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="12" refY="9" orient="auto">
      <path d="M0 0L18 9L0 18Z" fill="#111827"/>
    </marker>
    <marker id="greenArrow" markerWidth="18" markerHeight="18" refX="12" refY="9" orient="auto">
      <path d="M0 0L18 9L0 18Z" fill="#15803D"/>
    </marker>
    <marker id="redArrow" markerWidth="18" markerHeight="18" refX="12" refY="9" orient="auto">
      <path d="M0 0L18 9L0 18Z" fill="#DC2626"/>
    </marker>
  </defs>

  <g transform="translate(90 280)">
    <rect width="330" height="190" rx="20" fill="#EEF4FF" stroke="#2563EB" stroke-width="4"/>
    <text x="34" y="58" fill="#1D4ED8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850" letter-spacing="2">
      WORKER AGENT
    </text>
    <text x="34" y="115" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="850">
      does the work
    </text>
    <text x="34" y="155" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="23">
      edits, tests, writes
    </text>
  </g>

  <path d="M455 375H555" stroke="#111827" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(590 280)">
    <rect width="420" height="190" rx="20" fill="#111827"/>
    <text x="34" y="58" fill="#F9FAFB" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="850">
      VALIDATION.md
    </text>
    <text x="34" y="112" fill="#E5E7EB" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800">
      evidence + judges
    </text>
    <text x="34" y="153" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="22">
      tests · artifacts · reviewer agents
    </text>
  </g>

  <path d="M1045 375H1145" stroke="#111827" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(1180 280)">
    <rect width="330" height="190" rx="20" fill="#FFF7ED" stroke="#F97316" stroke-width="4"/>
    <text x="34" y="58" fill="#C2410C" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850" letter-spacing="2">
      JUDGE
    </text>
    <text x="34" y="115" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="850">
      checks
    </text>
    <text x="34" y="155" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="23">
      accepts or blocks
    </text>
  </g>

  <path d="M1335 490C1335 555 1195 575 1030 585" stroke="#15803D" stroke-width="5" stroke-linecap="round" marker-end="url(#greenArrow)"/>
  <path d="M1335 490C1375 590 1260 635 1088 650" stroke="#DC2626" stroke-width="5" stroke-linecap="round" marker-end="url(#redArrow)"/>

  <g transform="translate(720 585)">
    <rect width="300" height="105" rx="18" fill="#ECFDF5" stroke="#15803D" stroke-width="4"/>
    <text x="32" y="48" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="850">
      Accepted
    </text>
    <text x="32" y="80" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="22">
      done
    </text>
  </g>

  <g transform="translate(1095 645)">
    <rect width="300" height="105" rx="18" fill="#FEF2F2" stroke="#DC2626" stroke-width="4"/>
    <text x="32" y="48" fill="#991B1B" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="850">
      Blocked
    </text>
    <text x="32" y="80" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="22">
      keep working
    </text>
  </g>

  <path d="M1095 700C820 790 410 745 255 500" stroke="#DC2626" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 12" marker-end="url(#redArrow)"/>
  <text x="430" y="780" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="25">
    If validation fails, the failed judge becomes the next task.
  </text>
</svg>
