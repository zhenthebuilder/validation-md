<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <rect width="1600" height="900" fill="#FAF8F3"/>
  <defs>
    <filter id="shadow" x="-12%" y="-14%" width="124%" height="134%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#111827"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#B42318"/>
    </marker>
  </defs>

  <g transform="translate(120 270)" filter="url(#shadow)">
    <rect width="280" height="190" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
    <text x="34" y="62" fill="#1D4ED8" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="850">Agent</text>
    <text x="34" y="122" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="900">does work</text>
  </g>

  <path d="M435 365H505" stroke="#111827" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(535 270)" filter="url(#shadow)">
    <rect width="340" height="190" rx="18" fill="#FFFFFF" stroke="#D6C7AD" stroke-width="3"/>
    <text x="34" y="62" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="850">VALIDATION.md</text>
    <text x="34" y="122" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="900">defines done</text>
  </g>

  <path d="M910 365H975" stroke="#111827" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(1005 270)" filter="url(#shadow)">
    <rect width="235" height="190" rx="18" fill="#FFFDF8" stroke="#7A4A2A" stroke-width="4"/>
    <text x="34" y="62" fill="#5B351D" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="850">Judge</text>
    <text x="34" y="122" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="900">checks</text>
    <g transform="translate(168 34) rotate(-24)">
      <rect x="-24" y="-7" width="48" height="14" rx="5" fill="#D8A23A"/>
      <rect x="-4" y="5" width="8" height="28" rx="3" fill="#B8842D"/>
    </g>
  </g>

  <path d="M1275 365H1320" stroke="#111827" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(1345 270)" filter="url(#shadow)">
    <rect width="220" height="190" rx="18" fill="#FFFFFF" stroke="#D6C7AD" stroke-width="3"/>
    <text x="32" y="62" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="850">Verdict</text>
    <text x="32" y="120" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="850">accept</text>
    <text x="32" y="158" fill="#9A3412" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="850">retry</text>
  </g>

  <path d="M1455 460V616H260V488" stroke="#B42318" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 12" marker-end="url(#redArrow)"/>
</svg>
